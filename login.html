<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicia Sesión</title>
    <link rel="icon" href="imagenes/logo.png" />
    <style>
      /* Ocultar barra de scroll manteniendo funcionalidad */
      html,
      body {
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE y Edge */
      }
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none; /* Chrome, Safari y Edge */
      }
    </style>
  </head>
  <body class="bg-blue-900 min-h-screen flex items-center justify-center p-4">
    <div class="flex w-auto items-center justify-center">
      <div
        class="border rounded-lg p-16 px-23 max-w-md mx-auto bg-slate-900 shadow-black shadow-lg scale-117"
      >
        <div class="mb-4">
          <div class="text-center">
            <h1
              class="text-5xl font-extrabold cursor-default text-neutral-50 pb-5"
            >
              C<span
                class="drop-shadow-[0_0_1.5px_rgba(255,223,32,0.8)] text-amber-500"
                >+</span
              >
            </h1>
          </div>
          <br />
          <label
            id="labelMail"
            class="text-neutral-100 text-sm block"
            for="correo-id"
            >Correo electronico</label
          >
          <input
            placeholder=""
            id="correo-id"
            type="email"
            class="border rounded pl-1 mb-10 text-white w-full bg-slate-800"
          />
          <br />
          <label
            id="labelPassword"
            class="text-neutral-100 text-sm block"
            for="password-id"
            >Contraseña</label
          >
          <input
            placeholder=""
            id="password-id"
            type="password"
            class="border rounded pl-1 mb-10 text-white w-full bg-slate-800"
          />
        </div>
        <button
          id="btnEnviar"
          class="transition-all w-50 bg-blue-800 text-white font-bold py-2 rounded hover:bg-amber-400 hover:text-slate-950 cursor-pointer text-sm"
        >
          Iniciar Sesión
        </button>
        <hr class="mt-5 border-neutral-600" />
        <br />
        <div class="text-center">
          <button
            class="flex text-white transition-all w-50 p-2 bg-slate-800 rounded text-xs gap-2 justify-center"
          >
            <img src="imagenes/icons8-google.svg" alt="" class="w-5" />
            Continue con Google
          </button>
          <p class="text-white text-sm pt-3">
            Eres nuevo?
            <a
              href="register.html"
              class="text-blue-400 underline hover:text-amber-500"
              >crea una cuenta</a
            >
          </p>
        </div>
      </div>
    </div>
    <script>
      let inputMail = document.querySelector("#correo-id");
      let inputPassword = document.querySelector("#password-id");
      let labelMail = document.querySelector("#labelMail");
      let labelPassword = document.querySelector("#labelPassword");
      let btnEnviar = document.querySelector("#btnEnviar");
      function envioForm() {
        if (inputMail.value === "") {
          labelMail.classList.add("text-red-300");
          labelMail.classList.remove("text-neutral-100");
          labelPassword.classList.add("text-red-300");
          labelPassword.classList.remove("text-neutral-100");
          inputMail.classList.add("border-red-300");
          inputMail.classList.remove("border-neutral-100");
          inputPassword.classList.add("border-red-300");
          inputPassword.classList.remove("border-neutral-100");
          inputMail.placeholder = "Rellene la casilla";
          inputPassword.placeholder = "Rellene la casilla";
          inputMail.classList.add("placeholder-red-200");
          inputPassword.classList.add("placeholder-red-200");
          alert("HAS DEJADO CASILLAS VACIAS");
        } else if (inputPassword.value === "") {
          labelMail.classList.add("text-red-300");
          labelMail.classList.remove("text-neutral-100");
          labelPassword.classList.add("text-red-300");
          labelPassword.classList.remove("text-neutral-100");
          inputMail.classList.add("border-red-300");
          inputMail.classList.remove("border-neutral-100");
          inputPassword.classList.add("border-red-300");
          inputPassword.classList.remove("border-neutral-100");
          inputMail.placeholder = "Rellene la casilla";
          inputPassword.placeholder = "Rellene la casilla";
          inputMail.classList.add("placeholder-red-200");
          inputPassword.classList.add("placeholder-red-200");
          alert("HAS DEJADO CASILLAS VACIAS");
        } else {
          window.location.href = "cursosusuario.html";
        }
      }
      btnEnviar.addEventListener("click", envioForm);
      inputMail.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          envioForm();
        }
      });
      inputPassword.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          envioForm();
        }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </body>
</html>
